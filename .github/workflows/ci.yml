name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in the root package.json's packageManager field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ecofoco/shared --filter @ecofoco/app lint
      - run: pnpm --filter @ecofoco/shared --filter @ecofoco/app test
      - run: pnpm --filter @ecofoco/app build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ecofoco
          POSTGRES_PASSWORD: ecofoco
          POSTGRES_DB: ecofoco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecofoco -d ecofoco"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://ecofoco:ecofoco@localhost:5432/ecofoco
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Also generates the Prisma client (api postinstall)
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm test:e2e
      - run: pnpm build

  android:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Capacitor 8 / AGP 8.13 require JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The default package list includes the removed 'tools' package; AGP fetches platforms itself
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap sync android

      - name: Assemble debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Print APK signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'DN|SHA-256'

      - name: Locate merged manifest
        id: manifest
        run: |
          path=$(find android/app/build/intermediates -path '*merged_manifest*' -path '*debug*' -name AndroidManifest.xml | head -n 1)
          test -n "$path" || { echo "Merged manifest not found"; exit 1; }
          echo "path=app/$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ecofoco-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ecofoco-merged-manifest
          path: ${{ steps.manifest.outputs.path }}
          if-no-files-found: error

      - name: Check health permissions
        run: python3 ../.github/scripts/check-health-permissions.py "../${{ steps.manifest.outputs.path }}"

      - name: Check location permissions
        run: python3 ../.github/scripts/check-location-permissions.py "../${{ steps.manifest.outputs.path }}"

      - name: Check unused plugin permissions
        run: python3 ../.github/scripts/check-unused-permissions.py "../${{ steps.manifest.outputs.path }}"
