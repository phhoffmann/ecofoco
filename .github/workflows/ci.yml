name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Capacitor 8 / AGP 8.13 require JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate merged manifest
        id: manifest
        run: |
          path=$(find android/app/build/intermediates -path '*merged_manifest*' -path '*debug*' -name AndroidManifest.xml | head -n 1)
          test -n "$path" || { echo "Merged manifest not found"; exit 1; }
          echo "path=app/$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ecofoco-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ecofoco-merged-manifest
          path: ${{ steps.manifest.outputs.path }}
          if-no-files-found: error

      - name: Check health permissions
        run: python3 ../.github/scripts/check-health-permissions.py "../${{ steps.manifest.outputs.path }}"
